[project]
name = "smart-notify"
version = "0.4.1"
description = "Home Assistant Smart Notify custom integration"
readme = "README.md"
requires-python = ">=3.13.2"

[dependency-groups]
dev = [
    "homeassistant>=2026.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-homeassistant-custom-component>=0.13.206",
    "ruff>=0.8.0",
    "ty>=0.0.69",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
preview = true
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    # Docstring convention conflicts
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # Not a fit for this project / Home Assistant layout
    "missing-copyright-notice", # copyright headers
    "docstring-missing-returns", # pydoclint Returns (noisy with short Google docstrings)
    "docstring-missing-exception", # pydoclint Raises
    "implicit-namespace-package", # implicit namespace (HA custom_components / tests layout)
    "relative-imports", # relative imports are the HA convention
    "unused-async", # HA async entrypoints often have no await
    "non-empty-init-module", # HA __init__.py must define setup/unload hooks
    "no-self-use", # strategy/protocol methods intentionally unused self
    "typing-only-first-party-import", # prefer unconditional imports over TYPE_CHECKING blocks
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "assert",    # asserts
    "private-member-access",  # private-member access in tests
    "unused-function-argument",  # unused fixtures / args in tests
    "magic-value-comparison", # magic values in assertions
    "undocumented-public-module",    # undocumented-public-module
    "undocumented-public-function",    # undocumented-public-function
    "undocumented-public-package",    # undocumented-public-package
]

[tool.ty]
# Type-check the integration and its tests.

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["custom_components", "tests"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]