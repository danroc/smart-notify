[project]
name = "smart-notify"
version = "0.1.1"
description = "Home Assistant Smart Notify custom integration"
readme = "README.md"
requires-python = ">=3.13.2"

[dependency-groups]
dev = [
    "homeassistant>=2026.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-homeassistant-custom-component>=0.13.206",
    "ruff>=0.8.0",
    "ty>=0.0.69",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
preview = true
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts
    "COM812",
    "ISC001",
    # Docstring convention conflicts
    "D203",
    "D213",
    # Not a fit for this project / Home Assistant layout
    "CPY001", # copyright headers
    "DOC201", # pydoclint Returns (noisy with short Google docstrings)
    "DOC501", # pydoclint Raises
    "INP001", # implicit namespace (HA custom_components / tests layout)
    "TID252", # relative imports are the HA convention
    "RUF029", # HA async entrypoints often have no await
    "RUF067", # HA __init__.py must define setup/unload hooks
    "PLR6301", # strategy/protocol methods intentionally unused self
    "TC001", # prefer unconditional imports over TYPE_CHECKING blocks
    "TC002",
    "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts
    "SLF001",  # private-member access in tests
    "ARG001",  # unused fixtures / args in tests
    "PLR2004", # magic values in assertions
    "D100",    # undocumented-public-module
    "D103",    # undocumented-public-function
    "D104",    # undocumented-public-package
]

[tool.ty]
# Type-check the integration and its tests.

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["custom_components", "tests"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.analysis]
strict-literal-narrowing = true
strict-generic-narrowing = true

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]