send:
  name: Send
  description: Route a notification using Smart Notify strategies.
  fields:
    message:
      required: true
      example: Washing machine finished.
      selector:
        text:
    title:
      required: false
      example: Laundry
      selector:
        text:
    strategy:
      required: false
      example: closest
      selector:
        select:
          options:
            - label: Direct
              value: direct
            - label: Home
              value: home
            - label: Away
              value: away
            - label: Closest
              value: closest
            - label: Arrival
              value: arrival
    tolerance:
      required: false
      example: 500
      selector:
        number:
          min: 0
          step: 50
          mode: box
    queue_if_no_candidate:
      required: false
      description: >-
        Queue when nobody matches. Defaults to true for arrival and closest,
        false for other strategies.
      selector:
        boolean:
    expire_after:
      required: false
      example: 4h
      selector:
        text:
    priority:
      required: false
      example: normal
      selector:
        text:
    tag:
      required: false
      example: laundry
      selector:
        text:
    actions:
      required: false
      description: >-
        Action buttons for the Companion app (long-press on iOS). Handled via
        mobile_app_notification_action automations.
      example:
        - action: ACK
          title: Got it
    data:
      required: false
      selector:
        object:
    channels:
      required: false
      selector:
        object:
    metadata:
      required: false
      selector:
        object:
    persons:
      required: false
      description: Optional subset of configured person entities to consider.
      selector:
        entity:
          domain: person
          multiple: true
