send:
  name: Send
  description: >-
    Route a notification to the right people using presence and distance
    strategies, with optional queueing when nobody matches.
  fields:
    message:
      required: true
      description: Notification body text delivered to the notify target.
      example: Washing machine finished.
      selector:
        text:
    title:
      required: false
      description: Optional notification title shown on the device.
      example: Laundry
      selector:
        text:
    strategy:
      required: false
      description: >-
        Who should receive the notification. Defaults to the integration's
        configured default strategy. direct: everyone eligible; home: people at
        home now; away: people away now; closest: people within tolerance of the
        closest distance to home (queues when nobody has a usable location);
        arrival: people at home now, otherwise queue until someone arrives.
      example: closest
      selector:
        select:
          options:
            - label: Direct
              value: direct
            - label: Home
              value: home
            - label: Away
              value: away
            - label: Closest
              value: closest
            - label: Arrival
              value: arrival
    tolerance:
      required: false
      description: >-
        Distance in meters used by the closest strategy. Everyone whose
        distance to home is within this value of the closest person is
        notified. Defaults to the integration's configured default tolerance.
      example: 500
      selector:
        number:
          min: 0
          step: 50
          mode: box
    expire_after:
      required: false
      description: >-
        How long a queued notification is kept before it expires. Duration
        shorthand such as 30m, 4h, or 1d. Defaults to the integration's
        configured default expiration.
      example: 4h
      selector:
        text:
    level:
      required: false
      description: >-
        Notification urgency on mobile devices. silent: passive delivery;
        normal: standard alert; important: elevated alert (time-sensitive on
        iOS, high priority on Android); critical: time-critical alert that can
        break through focus modes.
      example: normal
      selector:
        select:
          options:
            - label: Silent
              value: silent
            - label: Normal
              value: normal
            - label: Important
              value: important
            - label: Critical
              value: critical
    tag:
      required: false
      description: >-
        Tag passed to the mobile app notify payload. A new notification with the
        same tag replaces the previous one. Ignored by iOS for critical
        notifications.
      example: laundry
      selector:
        text:
    group:
      required: false
      description: >-
        Group name for stacking notifications on the device. Ignored by iOS for
        critical notifications.
      example: appliances
      selector:
        text:
    image:
      required: false
      description: Image URL shown in the notification.
      example: /local/laundry.jpg
      selector:
        text:
    url:
      required: false
      description: >-
        URL opened when the notification is tapped. Accepts a relative path such
        as /lovelace/laundry or a full URL.
      example: /lovelace/laundry
      selector:
        text:
    actions:
      required: false
      description: >-
        Action buttons for the Companion app (long-press on iOS). Android shows
        at most 3 buttons, iOS around 10. Handled via
        mobile_app_notification_action automations.
      example:
        - action: ACK
          title: Got it
    persons:
      required: false
      description: Optional subset of configured person entities to consider.
      selector:
        entity:
          domain: person
          multiple: true
